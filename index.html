<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Defaults for crawlers without JS. Removed at boot (src/main.tsx); pages render their own via <Seo>. -->
    <title data-default>Robogyan · Experience Engineering</title>
    <meta
      data-default
      name="description"
      content="Robogyan is the oldest technical society of ADGIPS, Delhi: a student-run robotics, embedded and automation lab in Block 5, building since 2009."
    />
    <link data-default rel="canonical" href="https://www.robogyan.tech/" />
    <meta property="og:site_name" content="Robogyan" />
    <meta property="og:type" content="website" />
    <meta data-default property="og:title" content="Robogyan · Experience Engineering" />
    <meta
      data-default
      property="og:description"
      content="The oldest technical society of ADGIPS, Delhi. Robotics, embedded systems and automation, since 2009."
    />
    <meta data-default property="og:url" content="https://www.robogyan.tech/" />
    <meta property="og:image" content="https://www.robogyan.tech/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.robogyan.tech/og.png" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // This script checks to see if a redirect is present and converts the path
      // and query string into just a query string, then redirects the browser
      // to the new url with just a query string and hash fragment
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Robogyan needs JavaScript to show this page. Email robogyan.contact@gmail.com.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
